# Accountable roles under the governance model. Every obligation names one
# role that is responsible for its implementation.
#
# Roles are positions, not people. This keeps the catalog valid across
# personnel changes.

roles:
  - id: security_officer
    name: Chief Information Security Officer
    iso_clause: 5.3
    scope: Security policy, access control, and monitoring

  - id: system_owner
    name: System Owner
    iso_clause: 5.3
    scope: Configuration management, boundary protection, and system operations

  - id: compliance_officer
    name: Compliance Officer
    iso_clause: 5.3
    scope: ISMS governance and audit coordination

# Document registry. Every document referenced by any mapping must appear here.
#
# layer is one of: requirement, design, specification, verification
#
# URLs are optional. Each document can carry:
#   projectwise_url      - native protocol URL (pw://) for ProjectWise Explorer
#   projectwise_web_url  - HTTPS URL for browser-based access
#
# If both are present, the catalog renders an "Open" button and a "Web" button.
# If neither is present, the catalog renders a "Not filed" indicator.


# Documents the catalog links to. url can be any link your readers can open:
# https:// for web systems, pw:// for ProjectWise Explorer, file paths, and so on.
#
# layer       id from catalog.yaml layers (omit only for doc_type: reference)
# restricted  true if most readers cannot open it
# status_note shown instead of a link for documents that are not filed yet


      - document_id: SPEC-NET-001
        layer: specification
    status: deviations_noted
    notes: >
      Boundary protection design and firewall rule specification filed.
      Requirement-layer policy not yet created. Deviation logged for policy
      backfill in next quarterly cycle.

  - obligation_id: cmmc-l2-ac-l2-3-1-1
    documents:
      - document_id: POL-AC-001
        layer: requirement
      - document_id: DES-IAM-001
        layer: design
      - document_id: ART-IAM-001
        layer: verification
    status: verified
    notes: >
      Directly satisfied by the same evidence chain as NIST SP 800-171
      control 03.01.01. Cross-mapped.

  - obligation_id: iso-a-8-9
